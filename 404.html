<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Strona nie znaleziona – ZSEiL Warszawa</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: '#323e97',
          'brand-2': '#4a58c4',
          err: '#c62839',
        }
      }
    }
  }
</script>
<style>
:root{--brand:#323e97;--brand-2:#4a58c4;--text:#1a1a1a;--bg:#fff;--soft:#f1f3fc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
header{display:flex;justify-content:center;padding:22px 20px 18px;animation:fadeIn .8s both}
header img{height:84px;max-width:100%;display:block}
main{max-width:560px;margin:40px auto 60px;padding:0 16px;text-align:center}
.error-card{background:var(--soft);border-radius:32px;padding:44px 28px;animation:slideUp .7s both;box-shadow:0 4px 16px rgba(50,62,151,.05)}
.error-code{font-size:80px;font-weight:bold;color:var(--brand);line-height:1;margin:0 0 16px;animation:pop .8s .1s cubic-bezier(.2,.9,.3,1.2) both}
h1{font-size:26px;margin:0 0 12px;color:var(--brand)}
p{font-size:16px;line-height:1.5;margin:0 0 28px;color:#444}
.btn-home{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;border-radius:999px;padding:16px 36px;font-size:18px;font-weight:bold;transition:transform .2s,box-shadow .2s,background .2s}
.btn-home:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 24px rgba(50,62,151,.35);background:var(--brand-2)}
.btn-home:active{transform:scale(.98)}
footer{padding:22px;text-align:center;font-size:14px;color:var(--brand)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><img src="https://zseil.edu.pl/new/wp-content/themes/zseil-2027/assets/images/xlogo-zseil.png.pagespeed.ic.aHk5XasK9m.png" alt="ZSEiL"></header>

<main>
<div class="error-card">
<div class="error-code">404</div>
<h1>Nie znaleziono strony</h1>
<p>Szukana przez Ciebie strona nie istnieje, została przeniesiona lub podano błędny adres.</p>
<a class="btn-home" href="https://zseil-rekrutacje.pages.dev/">Wróć do strony głównej</a>
</div>
</main>

<footer>© 2026 Zespół Szkół Elektronicznych i Licealnych w Warszawie</footer>
</body>
</html>
